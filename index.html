<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Cadastro interativo de alunos com validação e busca.">
    <title>Cadastro interativo</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="pagina">
      <header class="cabecalho">
        <p class="etiqueta">Exercício de JavaScript</p>
        <h1>Cadastro interativo</h1>
        <p>Cadastre alunos, confira as médias e filtre a turma pelo nome.</p>
      </header>

      <section class="cartao" aria-labelledby="titulo-cadastro">
        <h2 id="titulo-cadastro">Novo aluno</h2>
        <form id="form-aluno" novalidate>
          <div class="campo">
            <label for="nome">Nome</label>
            <input
              id="nome"
              name="nome"
              type="text"
              autocomplete="name"
              aria-describedby="erro-nome"
            >
            <span class="mensagem-erro" id="erro-nome"></span>
          </div>

          <div class="campo">
            <label for="nota">Nota (0 a 10)</label>
            <input
              id="nota"
              name="nota"
              type="number"
              min="0"
              max="10"
              step="0.1"
              inputmode="decimal"
              aria-describedby="erro-nota"
            >
            <span class="mensagem-erro" id="erro-nota"></span>
          </div>

          <button type="submit">Cadastrar aluno</button>
        </form>
        <p class="mensagem-estado" id="mensagem-estado" role="status" aria-live="polite">
          A turma ainda está vazia.
        </p>
      </section>

      <section class="cartao" aria-labelledby="titulo-turma">
        <div class="titulo-turma">
          <div>
            <p class="etiqueta">Acompanhamento</p>
            <h2 id="titulo-turma">Turma</h2>
          </div>
          <div class="campo campo-busca">
            <label for="busca">Buscar aluno</label>
            <input
              id="busca"
              name="busca"
              type="search"
              autocomplete="off"
              placeholder="Digite um nome"
            >
          </div>
        </div>

        <div class="tabela-rolagem">
          <table>
            <caption class="somente-leitor">Alunos cadastrados e suas médias</caption>
            <thead>
              <tr>
                <th scope="col">Nome</th>
                <th scope="col">Média</th>
                <th scope="col">Resultado</th>
              </tr>
            </thead>
            <tbody id="lista-alunos"></tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
